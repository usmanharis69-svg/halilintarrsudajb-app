    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background-color: #f8fafc;
            background-image: 
                radial-gradient(at 10% 10%, hsla(210, 100%, 90%, 0.5) 0px, transparent 50%),
                radial-gradient(at 90% 10%, hsla(250, 100%, 92%, 0.5) 0px, transparent 50%),
                radial-gradient(at 50% 90%, hsla(330, 100%, 94%, 0.5) 0px, transparent 50%);
            background-attachment: fixed;
            color: #334155;
        }

        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        .fade-in { animation: fadeIn 0.3s ease-in-out forwards; }
        .slide-up { animation: slideUp 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        .pop-in { animation: popIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }
        
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes slideUp { from { transform: translateY(15px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        @keyframes popIn { from { transform: scale(0.9); opacity: 0; } to { transform: scale(1); opacity: 1; } }

        .glass {
            background: rgba(255, 255, 255, 0.75);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.6);
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.01);
        }
        
        .upload-area.dragover {
            border-color: #4f46e5;
            background-color: rgba(79, 70, 229, 0.05);
        }

        .grid-2x2 {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 0.75rem;
        }
    </style>

                <p class="text-sm text-slate-500 mt-1 mb-4 leading-relaxed" id="activeCategoryDesc">
                    Kelola dokumen SK, NIP, dan identitas kepegawaian.
                </p>
                
                <!-- Search Bar -->
                <div class="relative">
                    <i class="fa-solid fa-magnifying-glass absolute left-3.5 top-3 text-slate-400 text-sm"></i>
                    <input type="text" id="searchInput" placeholder="Cari nama dokumen..." class="w-full pl-10 pr-4 py-2 bg-white/70 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 transition-all backdrop-blur-sm shadow-sm">
                </div>
            </div>

            <!-- Upload Area -->
            <div class="mb-8 slide-up" style="animation-delay: 0.3s;">
                <input type="file" id="fileInput" accept=".pdf" class="hidden">
                <label for="fileInput" id="dropZone" class="upload-area cursor-pointer border-2 border-dashed border-indigo-300 rounded-3xl p-6 flex flex-col items-center justify-center glass hover:bg-white/80 transition-all duration-300 relative overflow-hidden group">
                    <div class="w-14 h-14 rounded-full bg-indigo-50 flex items-center justify-center mb-3 group-hover:scale-110 transition-transform duration-300 shadow-sm border border-indigo-100">
                        <i class="fa-solid fa-cloud-arrow-up text-xl text-indigo-500"></i>
                    </div>
                    <span class="font-semibold text-indigo-900 text-center text-sm">Tap untuk Upload PDF</span>
                    <span class="text-xs font-semibold text-red-400 mt-1">Maksimal: 15MB</span>
                    <span class="text-[10px] text-slate-500 mt-1.5 text-center">Tersimpan aman di perangkat (Tanpa Internet)</span>
                    <div id="uploadProgress" class="absolute bottom-0 left-0 h-1.5 bg-gradient-to-r from-blue-500 via-teal-500 to-emerald-500 w-0 transition-all duration-300"></div>
                </label>
            </div>

            <!-- File List Section -->
            <div class="slide-up pb-8" style="animation-delay: 0.4s;">
                <div class="flex justify-between items-center mb-4">
                    <h3 class="font-semibold text-slate-800 text-lg">Daftar Dokumen</h3>
                    <span class="text-xs font-bold px-3 py-1 bg-indigo-100 text-indigo-700 rounded-full" id="fileCount">0 File</span>
                </div>
                
                <div id="fileList" class="space-y-3 relative min-h-[150px]">
                    <!-- Files injected via JS -->
                </div>
            </div>
        </main>

        <!-- Toast Notification -->
        <div id="toast" class="fixed bottom-8 left-1/2 transform -translate-x-1/2 bg-slate-900/95 backdrop-blur-md text-white px-5 py-3 rounded-full shadow-2xl flex items-center space-x-3 transition-all duration-300 opacity-0 pointer-events-none translate-y-10 z-[100] w-max max-w-[90%] border border-slate-700">
            <i class="fa-solid fa-check-circle text-emerald-400 text-lg" id="toastIcon"></i>
            <span id="toastMessage" class="text-sm font-medium">Berhasil!</span>
        </div>
    </div>

    <script>
        // --- DATABASE & STATE MANAGEMENT ---
        const STORAGE_KEY = 'halilintar_app_data';
        const DB_NAME = 'HalilintarDB';
        const DB_VERSION = 2; 
        const STORE_NAME = 'pdf_binaries';
        let db;
        
        const categoriesData = [
            { id: 'kepegawaian', name: 'Kepegawaian', desc: 'Kelola dokumen SK, KTP, KK, dan NIP.', color: 'blue', icon: 'fa-id-card' },
            { id: 'pendidikan', name: 'Pendidikan', desc: 'Ijazah, Transkrip Nilai, dan akademik.', color: 'orange', icon: 'fa-graduation-cap' },
            { id: 'spkrkk', name: 'SPK & RKK', desc: 'Surat Penugasan & Rincian Kewenangan Klinis.', color: 'emerald', icon: 'fa-file-medical' },
            { id: 'sertifikat', name: 'Sertifikat', desc: 'Sertifikat pelatihan, seminar, STR, SIP.', color: 'pink', icon: 'fa-award' }
        ];

        let appState = {
            activeCategoryId: 'kepegawaian',
            searchQuery: '',
            files: JSON.parse(localStorage.getItem(STORAGE_KEY)) || {
                kepegawaian: [], pendidikan: [], spkrkk: [], sertifikat: []
            }
        };

        function saveToLocalStorage() {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(appState.files));
        }

        // --- INDEXED DB FUNCTIONS (Menggunakan ArrayBuffer) ---
        function initDB() {
            return new Promise((resolve, reject) => {
                const request = indexedDB.open(DB_NAME, DB_VERSION);
                request.onerror = (e) => reject(e.target.error);
                request.onsuccess = (e) => { db = e.target.result; resolve(db); };
                request.onupgradeneeded = (e) => {
                    db = e.target.result;
                    if (!db.objectStoreNames.contains(STORE_NAME)) {
                        db.createObjectStore(STORE_NAME, { keyPath: 'id' });
                    }
                };
            });
        }

        function saveFileToDB(id, arrayBuffer) {
            return new Promise((resolve, reject) => {
                const transaction = db.transaction([STORE_NAME], 'readwrite');
                const store = transaction.objectStore(STORE_NAME);
                const request = store.put({ id: id, data: arrayBuffer });
                request.onsuccess = () => resolve(true);
                request.onerror = (e) => reject(e.target.error);
            });
        }

        function getFileFromDB(id) {
            return new Promise((resolve, reject) => {
                const transaction = db.transaction([STORE_NAME], 'readonly');
                const store = transaction.objectStore(STORE_NAME);
                const request = store.get(id);
                request.onsuccess = (e) => resolve(e.target.result);
                request.onerror = (e) => reject(e.target.error);
            });
        }

        function deleteFileFromDB(id) {
            return new Promise((resolve, reject) => {
                const transaction = db.transaction([STORE_NAME], 'readwrite');
                const store = transaction.objectStore(STORE_NAME);
                const request = store.delete(id);
                request.onsuccess = () => resolve(true);
                request.onerror = (e) => reject(e.target.error);
            });
        }

        function getAllFilesFromDB() {
            return new Promise((resolve, reject) => {
                const transaction = db.transaction([STORE_NAME], 'readonly');
                const store = transaction.objectStore(STORE_NAME);
                const request = store.getAll();
                request.onsuccess = (e) => resolve(e.target.result);
                request.onerror = (e) => reject(e.target.error);
            });
        }

        // --- DOM ELEMENTS ---
        const DOM = {
            tabsContainer: document.getElementById('categoryTabs'),
            activeTitle: document.getElementById('activeCategoryTitle'),
            activeDesc: document.getElementById('activeCategoryDesc'),
            fileList: document.getElementById('fileList'),
            fileCount: document.getElementById('fileCount'),
            fileInput: document.getElementById('fileInput'),
            dropZone: document.getElementById('dropZone'),
            uploadProgress: document.getElementById('uploadProgress'),
            searchInput: document.getElementById('searchInput'),
            restoreInput: document.getElementById('restoreInput'),
            toast: document.getElementById('toast'),
            toastMessage: document.getElementById('toastMessage'),
            toastIcon: document.getElementById('toastIcon')
        };

        // --- INITIALIZATION & RENDERING ---
        async function initApp() {
            try {
                await initDB();
                renderTabs();
                renderContent();
                setupEventListeners();
            } catch (error) {
                showToast('Gagal memuat database internal.', 'error');
            }
        }

        function renderTabs() {
            DOM.tabsContainer.innerHTML = categoriesData.map(cat => {
                const isActive = cat.id === appState.activeCategoryId;
                const activeClasses = {
                    blue: 'bg-blue-600 text-white shadow-blue-500/40 border-blue-600',
                    orange: 'bg-orange-500 text-white shadow-orange-500/40 border-orange-500',
                    emerald: 'bg-emerald-500 text-white shadow-emerald-500/40 border-emerald-500',
                    pink: 'bg-pink-500 text-white shadow-pink-500/40 border-pink-500'
                };
                const inactiveClasses = {
                    blue: 'text-blue-600 border-blue-100 bg-blue-50 hover:bg-blue-100',
                    orange: 'text-orange-600 border-orange-100 bg-orange-50 hover:bg-orange-100',
                    emerald: 'text-emerald-600 border-emerald-100 bg-emerald-50 hover:bg-emerald-100',
                    pink: 'text-pink-600 border-pink-100 bg-pink-50 hover:bg-pink-100'
                };

                const stateClass = isActive ? `${activeClasses[cat.color]} shadow-lg z-10 scale-105` : `${inactiveClasses[cat.color]} glass scale-100`;

                return `
                    <div id="tab-${cat.id}" onclick="switchCategory('${cat.id}')" class="cursor-pointer border-2 p-3 rounded-2xl flex flex-col items-center justify-center gap-1.5 transition-all duration-300 transform ${stateClass}">
                        <i class="fa-solid ${cat.icon} text-2xl ${isActive ? 'text-white' : ''}"></i>
                        <span class="text-xs font-bold text-center leading-tight">${cat.name}</span>
                    </div>
                `;
            }).join('');
        }

        function switchCategory(categoryId) {
            if (appState.activeCategoryId === categoryId) return;
            appState.activeCategoryId = categoryId;
            DOM.searchInput.value = ''; 
            appState.searchQuery = '';
            renderTabs();
            
            DOM.fileList.style.opacity = '0';
            setTimeout(() => {
                renderContent();
                DOM.fileList.style.opacity = '1';
                DOM.fileList.classList.add('fade-in');
                setTimeout(() => DOM.fileList.classList.remove('fade-in'), 300);
            }, 150);
        }

        function renderContent() {
            const activeCat = categoriesData.find(c => c.id === appState.activeCategoryId);
            DOM.activeTitle.innerHTML = `<i class="fa-solid ${activeCat.icon} text-${activeCat.color}-500"></i> ${activeCat.name}`;
            DOM.activeDesc.textContent = activeCat.desc;
            
            let currentFiles = appState.files[appState.activeCategoryId] || [];
            
            if (appState.searchQuery) {
                currentFiles = currentFiles.filter(f => f.name.toLowerCase().includes(appState.searchQuery.toLowerCase()));
            }

            DOM.fileCount.textContent = `${currentFiles.length} File`;

            if (currentFiles.length === 0) {
                const emptyMsg = appState.searchQuery ? 'Dokumen tidak ditemukan.' : 'Belum ada dokumen di kategori ini.';
                DOM.fileList.innerHTML = `
                    <div class="absolute inset-0 flex flex-col items-center justify-center p-6 text-center glass rounded-3xl border border-dashed border-slate-300">
                        <div class="w-14 h-14 bg-white rounded-2xl shadow-sm flex items-center justify-center mb-3 text-slate-300">
                            <i class="fa-regular ${appState.searchQuery ? 'fa-face-frown' : 'fa-folder-open'} text-3xl"></i>
                        </div>
                        <p class="text-slate-600 font-semibold">${emptyMsg}</p>
                    </div>
                `;
                return;
            }

            DOM.fileList.innerHTML = currentFiles.map(file => `
                <div class="group bg-white p-3 rounded-2xl shadow-sm border border-slate-100 flex items-center justify-between gap-3 transition-all duration-300 hover:shadow-md relative overflow-hidden">
                    <div class="absolute left-0 top-0 bottom-0 w-1 bg-${activeCat.color}-400"></div>
                    
                    <div class="flex flex-1 items-start gap-3 cursor-pointer min-w-0 hover:opacity-80 transition-opacity" onclick="openPDF(${file.id})">
                        <div class="w-10 h-10 flex-shrink-0 bg-red-50 rounded-xl flex items-center justify-center border border-red-100">
                            <i class="fa-solid fa-file-pdf text-red-500 text-lg group-hover:scale-110 transition-transform"></i>
                        </div>
                        <div class="flex-1 min-w-0 pr-1">
                            <p class="text-sm font-semibold text-slate-800 truncate group-hover:text-indigo-600 transition-colors" title="${file.name}">${file.name}</p>
                            <div class="flex items-center text-[11px] text-slate-500 mt-0.5 gap-2 font-medium">
                                <span class="bg-slate-100 px-1.5 py-0.5 rounded">${file.size}</span>
                                <span>&bull;</span><span>${file.date}</span>
                            </div>
                        </div>
                    </div>
                    
                    <div class="flex gap-1.5 flex-shrink-0">
                        <!-- TAMBAHAN TOMBOL VIEW -->
                        <button onclick="openPDF(${file.id})" class="w-8 h-8 rounded-full bg-emerald-50 text-emerald-500 hover:bg-emerald-100 transition-colors flex items-center justify-center" title="Lihat">
                            <i class="fa-solid fa-eye text-xs"></i>
                        </button>
                        
                        <button onclick="renameFile(${file.id}, '${file.name}')" class="w-8 h-8 rounded-full bg-amber-50 text-amber-500 hover:bg-amber-100 transition-colors flex items-center justify-center" title="Ubah Nama">
                            <i class="fa-solid fa-pen text-xs"></i>
                        </button>
                        <button onclick="downloadPDF(${file.id}, '${file.name}')" class="w-8 h-8 rounded-full bg-blue-50 text-blue-500 hover:bg-blue-100 transition-colors flex items-center justify-center" title="Unduh">
                            <i class="fa-solid fa-download text-xs"></i>
                        </button>
                        <button onclick="deleteFile(${file.id})" class="w-8 h-8 rounded-full bg-red-50 text-red-400 hover:bg-red-100 transition-colors flex items-center justify-center" title="Hapus">
                            <i class="fa-solid fa-trash-can text-xs"></i>
                        </button>
                    </div>
                </div>
            `).join('');
        }

        // --- FILE OPERATIONS ---
        async function openPDF(id) {
            showToast('Membuka dokumen...', 'info');
            try {
                const fileRecord = await getFileFromDB(id);
                if (!fileRecord || !fileRecord.data) throw new Error('Data tidak ditemukan');
                
                const blob = new Blob([fileRecord.data], { type: 'application/pdf' });
                const objectUrl = URL.createObjectURL(blob);
                window.open(objectUrl, '_blank');
            } catch (error) {
                showToast('Gagal membuka file.', 'error');
            }
        }

        async function downloadPDF(id, name) {
            showToast('Menyiapkan unduhan...', 'info');
            try {
                const fileRecord = await getFileFromDB(id);
                if (!fileRecord || !fileRecord.data) throw new Error('Data tidak ditemukan');
                
                const blob = new Blob([fileRecord.data], { type: 'application/pdf' });
                const objectUrl = URL.createObjectURL(blob);
                
                const a = document.createElement('a');
                a.style.display = 'none';
                a.href = objectUrl;
                a.download = name;
                document.body.appendChild(a);
                a.click();
                
                setTimeout(() => {
                    document.body.removeChild(a);
                    URL.revokeObjectURL(objectUrl);
                }, 100);
            } catch (error) {
                showToast('Gagal mengunduh file.', 'error');
            }
        }

        function handleFiles(files) {
            if (files.length === 0) return;
            const file = files[0];
            
            if (file.type !== 'application/pdf' && !file.name.toLowerCase().endsWith('.pdf')) {
                showToast('Gagal: Hanya file PDF yang diizinkan!', 'error'); return;
            }
            if (file.size > 15 * 1024 * 1024) {
                showToast('Gagal: Maksimal ukuran file 15MB!', 'error'); return;
            }

            const sizeInMB = (file.size / (1024 * 1024)).toFixed(1);
            const sizeStr = sizeInMB > 0.1 ? `${sizeInMB} MB` : `${(file.size / 1024).toFixed(0)} KB`;
            
            const isDuplicate = appState.files[appState.activeCategoryId].some(f => f.name === file.name && f.size === sizeStr);
            if (isDuplicate) {
                showToast('File ini sudah ada di kategori ini!', 'error'); return;
            }

            const reader = new FileReader();
            DOM.dropZone.style.pointerEvents = 'none';
            
            reader.onload = (e) => {
                const arrayBuffer = e.target.result;
                simulateUpload(file, arrayBuffer, sizeStr);
            };
            reader.onerror = () => {
                showToast('Gagal membaca file.', 'error');
                DOM.dropZone.style.pointerEvents = 'auto';
            };
            reader.readAsArrayBuffer(file);
        }

        function simulateUpload(file, arrayBuffer, sizeStr) {
            let progress = 0;
            const interval = setInterval(() => {
                progress += Math.random() * 25 + 15; 
                if (progress >= 100) progress = 100;
                DOM.uploadProgress.style.width = `${progress}%`;
                
                if (progress === 100) {
                    clearInterval(interval);
                    setTimeout(() => {
                        completeUpload(file, arrayBuffer, sizeStr);
                        DOM.uploadProgress.style.width = '0%';
                        DOM.dropZone.style.pointerEvents = 'auto';
                    }, 400);
                }
            }, 100);
        }

        async function completeUpload(file, arrayBuffer, sizeStr) {
            const today = new Date();
            const dateStr = `${today.getDate()} ${today.toLocaleString('id-ID', { month: 'short' })} ${today.getFullYear()}`;
            const fileId = Date.now();

            try {
                await saveFileToDB(fileId, arrayBuffer); 
                
                appState.files[appState.activeCategoryId].unshift({
                    id: fileId, name: file.name, size: sizeStr, date: dateStr
                });
                
                saveToLocalStorage();
                renderContent();
                showToast('Dokumen berhasil diarsip!');
                DOM.fileInput.value = ''; 
            } catch (error) {
                showToast('Gagal menyimpan file.', 'error');
            }
        }

        async function deleteFile(fileId) {
            if (!confirm('Yakin ingin menghapus dokumen ini?')) return;
            try {
                await deleteFileFromDB(fileId);
                appState.files[appState.activeCategoryId] = appState.files[appState.activeCategoryId].filter(f => f.id !== fileId);
                saveToLocalStorage();
                renderContent();
                showToast('Dokumen dihapus.', 'info');
            } catch (error) {
                showToast('Gagal menghapus file.', 'error');
            }
        }

        function renameFile(fileId, currentName) {
            let newName = prompt('Ubah nama dokumen (akhiri dengan .pdf):', currentName);
            if (!newName || newName.trim() === '' || newName === currentName) return;
            if (!newName.toLowerCase().endsWith('.pdf')) newName += '.pdf';

            const catFiles = appState.files[appState.activeCategoryId];
            const fileIndex = catFiles.findIndex(f => f.id === fileId);
            if (fileIndex !== -1) {
                catFiles[fileIndex].name = newName;
                saveToLocalStorage();
                renderContent();
                showToast('Nama berhasil diubah!', 'success');
            }
        }

        // --- BACKUP & RESTORE (.ZIP VERSION DENGAN NAMA FILE ASLI) ---
        async function backupData() {
            if (typeof JSZip === 'undefined') {
                showToast('Pastikan Anda terkoneksi internet untuk memuat library Backup.', 'error'); return;
            }
            
            showToast('Menyiapkan file ZIP backup...', 'info');
            try {
                const zip = new JSZip();
                
                zip.file("metadata.json", JSON.stringify(appState.files, null, 2));
                
                const rootFolder = zip.folder("arsip_pdf");
                const allFiles = await getAllFilesFromDB();
                
                const fileLookup = {};
                for (const category in appState.files) {
                    appState.files[category].forEach(f => {
                        fileLookup[f.id] = { name: f.name, category: category };
                    });
                }
                
                for (const file of allFiles) {
                    const fileInfo = fileLookup[file.id];
                    if (fileInfo) {
                        const catFolder = rootFolder.folder(fileInfo.category);
                        catFolder.file(fileInfo.name, file.data);
                    }
                }
                
                const zipContent = await zip.generateAsync({ type: "blob" });
                const url = URL.createObjectURL(zipContent);
                const a = document.createElement('a');
                const today = new Date().toISOString().split('T')[0];
                
                a.href = url;
                a.download = `Halilintar_Backup_${today}.zip`;
                document.body.appendChild(a);
                a.click();
                
                setTimeout(() => { document.body.removeChild(a); URL.revokeObjectURL(url); }, 100);
                showToast('Backup ZIP berhasil diunduh!');
            } catch (error) {
                console.error(error);
                showToast('Gagal membuat backup data.', 'error');
            }
        }

        function handleRestore(event) {
            const file = event.target.files[0];
            if (!file) return;
            
            if (typeof JSZip === 'undefined') {
                showToast('Pastikan Anda terkoneksi internet untuk memuat library Restore.', 'error'); 
                event.target.value = ''; return;
            }

            if (!confirm('Peringatan: Restore data akan menimpa seluruh arsip yang ada di browser saat ini. Lanjutkan?')) {
                event.target.value = ''; return;
            }

            showToast('Mengekstrak file ZIP...', 'info');
            const reader = new FileReader();
            
            reader.onload = async (e) => {
                try {
                    const zipData = e.target.result;
                    const zip = await JSZip.loadAsync(zipData);
                    
                    const metadataFile = zip.file("metadata.json");
                    if (!metadataFile) throw new Error("File metadata.json tidak ditemukan di dalam ZIP");
                    
                    const metadataStr = await metadataFile.async("string");
                    const parsedMetadata = JSON.parse(metadataStr);

                    db.close();
                    await new Promise((res, rej) => {
                        const req = indexedDB.deleteDatabase(DB_NAME);
                        req.onsuccess = res; req.onerror = rej;
                    });
                    
                    await initDB();
                    
                    const rootFolder = zip.folder("arsip_pdf");
                    if (rootFolder) {
                        for (const category in parsedMetadata) {
                            for (const fileMeta of parsedMetadata[category]) {
                                const zipFile = rootFolder.file(`${category}/${fileMeta.name}`);
                                if (zipFile) {
                                    const arrayBuffer = await zipFile.async("arraybuffer");
                                    await saveFileToDB(fileMeta.id, arrayBuffer);
                                }
                            }
                        }
                    }
                    
                    appState.files = parsedMetadata;
                    saveToLocalStorage();
                    
                    renderContent();
                    showToast('Restore data ZIP berhasil!');
                } catch (error) {
                    console.error(error);
                    showToast('File ZIP tidak valid atau rusak!', 'error');
                }
                event.target.value = '';
            };
            
            reader.readAsArrayBuffer(file);
        }

        // --- NOTIFICATION & EVENTS ---
        function showToast(message, type = 'success') {
            DOM.toastMessage.textContent = message;
            
            DOM.toastIcon.className = ''; 
            if (type === 'error') DOM.toastIcon.className = 'fa-solid fa-circle-exclamation text-red-400 text-lg';
            else if (type === 'info') DOM.toastIcon.className = 'fa-solid fa-info-circle text-blue-400 text-lg';
            else DOM.toastIcon.className = 'fa-solid fa-check-circle text-emerald-400 text-lg';

            DOM.toast.classList.remove('opacity-0', 'pointer-events-none', 'translate-y-10');
            DOM.toast.classList.add('opacity-100', 'translate-y-0');
            
            setTimeout(() => {
                DOM.toast.classList.remove('opacity-100', 'translate-y-0');
                DOM.toast.classList.add('opacity-0', 'pointer-events-none', 'translate-y-10');
            }, 3000);
        }

        function setupEventListeners() {
            DOM.fileInput.addEventListener('change', (e) => handleFiles(e.target.files));
            DOM.restoreInput.addEventListener('change', handleRestore);
            
            DOM.searchInput.addEventListener('input', (e) => {
                appState.searchQuery = e.target.value;
                renderContent();
            });

            ['dragenter', 'dragover', 'dragleave', 'drop'].forEach(eventName => {
                DOM.dropZone.addEventListener(eventName, e => { e.preventDefault(); e.stopPropagation(); }, false);
            });
            ['dragenter', 'dragover'].forEach(eventName => {
                DOM.dropZone.addEventListener(eventName, () => DOM.dropZone.classList.add('dragover', 'scale-[0.98]'), false);
            });
            ['dragleave', 'drop'].forEach(eventName => {
                DOM.dropZone.addEventListener(eventName, () => DOM.dropZone.classList.remove('dragover', 'scale-[0.98]'), false);
            });
            DOM.dropZone.addEventListener('drop', (e) => handleFiles(e.dataTransfer.files), false);
        }

        window.onload = initApp;
    </script>
</body>
</html>
